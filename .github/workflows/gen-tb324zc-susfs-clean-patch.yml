name: Generate TB324ZC 6.12.38 Clean SuSFS Patch

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUSFS_REPO_URL: "https://gitlab.com/simonpunk/susfs4ksu"
  SUSFS_REPO_BRANCH: "gki-android16-6.12"
  COMMON_SOURCE_URL: "https://github.com/yapixel/gki-build-assets/releases/download/android16-6.12.38_r00/common-android16-6.12.38_r00.tar.gz"

jobs:
  generate-clean-patch:
    name: Generate Clean SuSFS Patch (6.12.38)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends aria2 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends aria2)

      - name: Download & Extract Kernel Source
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          echo "Downloading GKI 6.12.38 kernel source..."
          aria2c -s 16 -x 16 -k 1M "${{ env.COMMON_SOURCE_URL }}" -o common.tar.gz || curl -fL "${{ env.COMMON_SOURCE_URL }}" -o common.tar.gz
          mkdir -p common && tar -xzf common.tar.gz -C common && rm -f common.tar.gz
          sed -i 's/ -dirty//g' common/scripts/setlocalversion

      - name: Apply Pre-SuSFS Patches (GKI & Manual Hooks)
        working-directory: kernel_workspace/common
        run: |
          echo "Applying pre-SuSFS patches matching baseline 5e0b874..."
          patch -p1 -l < "${{ github.workspace }}/.github/patches/gki/unicode_bypass_fix.patch"
          patch -p1 -l --fuzz=3 < "${{ github.workspace }}/.github/patches/xxksu/manual-security-hooks-v2.0.patch"
          patch -p1 -l < "${{ github.workspace }}/.github/patches/xxksu/scope-min-manual-hooks-v2.3.patch"

      - name: Clone SuSFS Repository
        run: |
          git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu

      - name: Record Pre-SuSFS Baseline (Git Snapshot)
        working-directory: kernel_workspace/common
        run: |
          echo "Initializing temporary baseline Git repository..."
          if [ ! -d ".git" ]; then
            git init
          fi
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -A
          git commit -m "pre-susfs baseline"

      - name: Apply SuSFS Patches
        working-directory: kernel_workspace/common
        run: |
          echo "Copying SuSFS core files..."
          cp "${{ github.workspace }}/susfs4ksu/kernel_patches/fs/susfs.c" fs/
          cp "${{ github.workspace }}/susfs4ksu/kernel_patches/include/linux/susfs.h" include/linux/
          cp "${{ github.workspace }}/susfs4ksu/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "Adapting official SuSFS patch via susfs_deinlined.sh..."
          SUSFS_PATCH="${{ github.workspace }}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch"
          bash "${{ github.workspace }}/.github/scripts/susfs_deinlined.sh" "$SUSFS_PATCH" deinlined.patch

          echo "Applying deinlined patch..."
          patch -p1 < deinlined.patch
          rm -f deinlined.patch

          echo "Checking for patch rejection files..."
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Patch rejects detected during SuSFS application:"
            find . -name '*.rej' -print
            exit 1
          fi

      - name: Generate Clean SuSFS Patch
        working-directory: kernel_workspace/common
        run: |
          echo "Generating clean patch from baseline..."
          git add -N .
          git diff --binary HEAD > "${{ github.workspace }}/susfs-gki-android16-6.12.38-clean.patch"

      - name: Verify Clean Patch Artifact
        run: |
          PATCH_FILE="${{ github.workspace }}/susfs-gki-android16-6.12.38-clean.patch"

          test -s "$PATCH_FILE" || { echo "::error::Generated patch is empty or missing!"; exit 1; }

          echo "=== 1. Checking for patch rejection files (.rej) in workspace ==="
          if find kernel_workspace/common -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Patch rejects found in workspace"
            exit 1
          fi
          echo "✅ No .rej files found."

          echo "=== 2. Diff targets in clean patch ==="
          grep '^diff --git ' "$PATCH_FILE"

          echo "=== 3. SHA-256 Checksum ==="
          sha256sum "$PATCH_FILE"

          echo "=== 4. Line count ==="
          wc -l "$PATCH_FILE"

          echo "=== 5. Verify essential SuSFS files in patch ==="
          grep -q 'diff --git a/fs/susfs.c' "$PATCH_FILE" || { echo "::error::Missing fs/susfs.c in clean patch"; exit 1; }
          grep -q 'diff --git a/include/linux/susfs.h' "$PATCH_FILE" || { echo "::error::Missing include/linux/susfs.h in clean patch"; exit 1; }
          grep -q 'diff --git a/include/linux/susfs_def.h' "$PATCH_FILE" || { echo "::error::Missing include/linux/susfs_def.h in clean patch"; exit 1; }
          echo "✅ Clean patch verification passed."

      - name: Upload Clean Patch Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tb324zc-6.12.38-clean-susfs-patch
          path: susfs-gki-android16-6.12.38-clean.patch
          if-no-files-found: error
