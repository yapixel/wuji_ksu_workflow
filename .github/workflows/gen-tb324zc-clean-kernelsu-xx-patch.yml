name: Generate Clean KernelSU xx Patch

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU Branch'
        required: true
        type: choice
        options:
          - 'master'
          - 'staging'
        default: 'master'

permissions:
  contents: read

jobs:
  generate:
    name: Generate clean xx.patch (${{ github.event.inputs.ksu_branch }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install patch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patch

      - name: Clone xxKSU source
        run: |
          set -euo pipefail

          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"

          git clone \
            --depth=1 \
            --single-branch \
            --no-tags \
            --branch="$KSU_BRANCH" \
            "https://github.com/backslashxx/KernelSU" \
            KernelSU

      - name: Recreate pre-xx.patch KernelSU state
        working-directory: KernelSU
        shell: bash
        run: |
          set -euo pipefail

          # Match the main workflow's Setup xxKSU Source mutation
          # that occurs inside the KernelSU checkout before xx.patch.
          cp -r uapi kernel/uapi 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No pre-xx.patch KernelSU tree changes to snapshot."
          else
            git commit -q -m "pre-xx.patch baseline"
          fi

          echo "BASELINE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch upstream xx.patch
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/midori01/KernelSU/commit/xx.patch" \
            -o upstream-xx.patch

          test -s upstream-xx.patch

          echo "=== Upstream xx.patch targets ==="
          grep '^diff --git ' upstream-xx.patch || true

          echo "=== Upstream xx.patch SHA256 ==="
          sha256sum upstream-xx.patch

      - name: Apply upstream xx.patch exactly as main workflow
        working-directory: KernelSU
        shell: bash
        run: |
          set -euo pipefail

          APPLY_LOG="${{ runner.temp }}/xx-apply.log"

          if ! patch -p1 -l --fuzz=3 \
            < "${{ github.workspace }}/upstream-xx.patch" \
            >"$APPLY_LOG" 2>&1; then
            cat "$APPLY_LOG"
            echo "Upstream xx.patch failed to apply." >&2
            exit 1
          fi

          cat "$APPLY_LOG"

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "Reject files were generated by upstream xx.patch:" >&2
            find . -name '*.rej' -print
            exit 1
          fi

      - name: Export clean KernelSU-side patch
        working-directory: KernelSU
        shell: bash
        run: |
          set -euo pipefail

          OUT="${{ github.workspace }}/xx-kernelsu-${{ github.event.inputs.ksu_branch }}-clean.patch"

          git diff --binary "$BASELINE" > "$OUT"

          test -s "$OUT"
          grep -q '^diff --git ' "$OUT"

          echo "=== Clean xx.patch targets ==="
          grep '^diff --git ' "$OUT"

          echo "=== Clean xx.patch stats ==="
          wc -l "$OUT"
          sha256sum "$OUT"

      - name: Verify clean patch against exact KernelSU baseline
        working-directory: KernelSU
        shell: bash
        run: |
          set -euo pipefail

          OUT="${{ github.workspace }}/xx-kernelsu-${{ github.event.inputs.ksu_branch }}-clean.patch"
          VERIFY_LOG="${{ runner.temp }}/xx-clean-verify.log"

          git reset --hard "$BASELINE"
          git clean -fd

          if ! patch --dry-run -p1 \
            < "$OUT" \
            >"$VERIFY_LOG" 2>&1; then
            cat "$VERIFY_LOG"
            echo "Clean xx.patch dry-run failed." >&2
            exit 1
          fi

          cat "$VERIFY_LOG"

          if grep -Eiq 'offset|fuzz|FAILED|malformed|reject' "$VERIFY_LOG"; then
            echo "Clean xx.patch is not clean: offset/fuzz/failure detected." >&2
            exit 1
          fi

          echo "Verified: clean KernelSU xx.patch applies with zero offset, zero fuzz, zero rejects."

      - name: Upload clean xx.patch
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tb324zc-kernelsu-${{ github.event.inputs.ksu_branch }}-clean-xx-patch
          path: xx-kernelsu-${{ github.event.inputs.ksu_branch }}-clean.patch
          if-no-files-found: error
          retention-days: 7
